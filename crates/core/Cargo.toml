[package]
name = "zero-api-key-core"
version = "0.2.0"
license = "MIT"
description = "Personal secret manager: local encrypted vault + Infisical Cloud"
edition = "2024"

[lib]
name = "zero_api_key_lib"


[[bin]]
name = "zak"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
anyhow = "1"
keyring = { version = "3", features = ["apple-native"] }
security-framework = "3"
security-framework-sys = "2"
core-foundation = "0.10"
core-foundation-sys = "0.8"
objc2-local-authentication = { version = "0.3", default-features = false, features = ["std", "LAContext", "block2"] }
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = "0.3"
dirs = "6"
toml = "0.8"
dialoguer = "0.11"
chacha20poly1305 = "0.10"
pbkdf2 = "0.12"
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
